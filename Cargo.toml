[package]
name = "aletheia"
version = "0.1.0"
edition = "2021"
authors = ["Mohit Rajdeo <mohit@theeducode.com>"]
description = "CIEL Aletheia: Ultra-low-latency in-memory fuel-metered verification engine for AI reasoning and RL rollouts"
license = "Apache-2.0"

[lib]
name = "aletheia"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "aletheia"
path = "src/main.rs"

[dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
